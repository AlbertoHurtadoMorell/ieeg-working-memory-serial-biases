[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ieeg-wm"
version = "0.1.0"
description = "Preprocessing and decoding tools for intracranial EEG working-memory research"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alberto Hurtado" },
]
keywords = [
    "neuroscience", "ieeg", "seeg", "eeg", "preprocessing",
    "decoding", "working-memory", "artifact-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.12,<2.0",
    "pandas>=2.1,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13",
    "mne>=1.6,<2.0",
    "mne-bids>=0.14,<1.0",
    "nibabel>=5.1",
    "nilearn>=0.10",
    "nitime>=0.10",
    "scikit-learn>=1.4,<2.0",
    "astropy>=6.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
deep-learning = [
    "tensorflow>=2.16,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/albertohurtado/ieeg-working-memory"
"LinkedIn" = "https://www.linkedin.com/in/alberto-hurtado-morell/"

[tool.setuptools.packages.find]
where = ["."]
include = ["ieeg_wm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
