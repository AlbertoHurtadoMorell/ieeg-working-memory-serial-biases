name: ieeg-wm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26,<2.0
  - scipy>=1.12,<2.0
  - pandas>=2.1,<3.0
  - matplotlib>=3.8,<4.0
  - seaborn>=0.13
  - nibabel>=5.1
  - nilearn>=0.10
  - scikit-learn>=1.4,<2.0
  - astropy>=6.0
  - statsmodels>=0.14
  - jupyter
  - ipykernel
  - pip
  - pip:
    - mne>=1.6,<2.0
    - mne-bids>=0.14,<1.0
    - nitime>=0.10
    # Uncomment to enable optional features:
    # - autoreject         # interactive epoch rejection visualization
    # - tensorflow>=2.16   # deep-learning (ForwardEncoding notebook)

# ── External — not in pip/conda ───────────────────────────────────────────
# decoding_toolbox — https://github.com/alepebel/decoding_toolbox
# After cloning, add its Helper_funcs/ directory to sys.path or PYTHONPATH.
